<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Donne Ton Point</title>
        <style>
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-bounce-short {
            animation: bounce-short 1s ease-in-out infinite;
        }
    </style>
    <link rel="stylesheet" href="/styles.css">
    <script src="i18n.js"></script>
    <script src="app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 opacity-0 transition-opacity duration-500" id="admin-body">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-xl md:text-3xl font-black text-slate-800" data-i18n="admin.title">Console Admin 🛠️</h1>
                <p class="text-xs md:text-sm font-bold text-slate-500 mt-1" id="admin-scope"><span data-i18n="admin.scope">Équipe :</span> <span id="admin-team-name">…</span></p>
            </div>
            <div class="flex flex-wrap justify-end gap-x-3 gap-y-2 items-center text-sm">
                <a href="/owner" id="link-owner" class="text-emerald-600 font-bold hover:underline whitespace-nowrap" style="display:none;" data-i18n="nav.owner">Owner 🌐</a>
                <a href="/superadmin" id="link-superadmin" class="text-purple-600 font-bold hover:underline whitespace-nowrap" style="display:none;" data-i18n="nav.superadmin">Société 🏛️</a>
                <a href="/" class="text-blue-600 font-bold hover:underline whitespace-nowrap" data-i18n="common.back_to_app">← App</a>
                <span class="text-slate-300 hidden sm:inline">|</span>
                <span class="whitespace-nowrap">
                    <button data-lang-toggle="fr" onclick="setLang('fr')" class="text-xs font-bold text-slate-500 px-1">FR</button>
                    <span class="text-slate-300">/</span>
                    <button data-lang-toggle="en" onclick="setLang('en')" class="text-xs font-bold text-slate-500 px-1">EN</button>
                </span>
            </div>
        </header>

        <div class="bg-white p-2 md:p-6 rounded-2xl shadow-sm border border-slate-200 mt-8">
            <h2 class="text-xl font-bold mb-4" data-i18n="admin.add_user_title">Ajouter un collègue</h2>
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <input type="text" id="new-user-name" data-i18n-placeholder="admin.user_name_placeholder" placeholder="Nom du collègue..." class="flex-1 p-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" id="new-user-email" data-i18n-placeholder="admin.user_email_placeholder" placeholder="Email (optionnel)" class="flex-1 p-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addUser()" class="bg-blue-600 text-white px-4 md:px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">
                    <span class="md:hidden">+</span>
                    <span class="hidden md:inline" data-i18n="common.add">Ajouter</span>
                </button>
            </div>
            <table class="w-full text-left">
                <thead class="bg-slate-100 border-b border-slate-200">
                    <tr>
                        <th class="p-4 font-bold text-slate-600" data-i18n="admin.col_name">Nom</th>
                        <th class="p-4 font-bold text-slate-600 hidden sm:table-cell" data-i18n="admin.col_magic_link">Lien Magique</th>
                        <th class="p-4 font-bold text-slate-600 text-right" data-i18n="admin.col_actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-users-list">
                    </tbody>
            </table>
        </div>

        <div class="bg-white p-2 md:p-6 rounded-2xl shadow-sm border border-slate-200 mt-8">
            <h2 class="text-xl font-bold mb-4 text-slate-800" data-i18n="admin.badges_title">Gestion des Badges</h2>

            <div class="flex flex-col md:flex-row gap-4 mb-8 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <input type="text" id="new-cat-emoji" data-i18n-placeholder="admin.badge_emoji_placeholder" placeholder="Emoji" class="w-full md:w-20 p-3 rounded-xl border border-slate-200 text-center text-xl shadow-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                <input type="text" id="new-cat-name" data-i18n-placeholder="admin.badge_name_placeholder" placeholder="Nom du badge (ex: Humour)" class="flex-1 p-3 rounded-xl border border-slate-200 shadow-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                <button onclick="addCategory()" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-700 hover:shadow-lg transition-all" data-i18n="admin.create_badge">Créer le badge</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="admin-categories-list"></div>
        </div>

        <div class="bg-white p-2 md:p-6 rounded-2xl shadow-sm border border-slate-200 mt-8">
            <h2 class="text-xl font-bold mb-4 text-orange-600" data-i18n="admin.rules_title">⚖️ Paramétrage des Gages</h2>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-white-50 rounded-xl mb-6">
                <div>
                    <label class="block text-xs font-bold mb-1" data-i18n="admin.rule_badge">Badge</label>
                    <select id="rule-cat" class="w-full p-2 rounded-lg border"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1" data-i18n="admin.rule_threshold">Seuil (points)</label>
                    <input type="number" id="rule-threshold" value="10" class="w-full p-2 rounded-lg border">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold mb-1" data-i18n="admin.rule_dare_text">Gage à accomplir</label>
                    <div class="flex gap-2">
                        <input type="text" id="rule-text" data-i18n-placeholder="admin.rule_dare_placeholder" placeholder="Ex: Amener des croissants" class="flex-1 p-2 rounded-lg border">
                        <button onclick="addRule()" class="bg-orange-600 text-white px-4 rounded-lg font-bold">OK</button>
                    </div>
                </div>
            </div>

            <div id="rules-list" class="space-y-2">
                </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mt-8">
            <h2 class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">
                <span class="w-2 h-6 bg-orange-500 rounded-full"></span>
                <span data-i18n="admin.dare_log_title">Historique des gages acquittés</span>
            </h2>
            <div id="admin-dare-log" class="space-y-2 max-h-75 overflow-y-auto">
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mt-8">
            <h2 class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">
                <span class="w-2 h-6 bg-blue-500 rounded-full"></span>
                <span data-i18n="admin.global_log_title">Historique global des points</span>
            </h2>
            <div id="admin-global-log" class="space-y-2 max-h-125 overflow-y-auto">
                </div>
        </div>
    </div>

    <script>
        // Auth admin : on s'appuie sur le magic link (token user dans localStorage)
        // et on vérifie via /api/me que le role === 'admin'.
        const myUserId = localStorage.getItem('my_user_id');

        async function checkAndLoad() {
            if (!myUserId) {
                alert(t('admin.connect_first'));
                return window.location.href = "/";
            }

            const res = await fetch('/api/me', {
                headers: { 'Authorization': `Bearer ${myUserId}` }
            });

            if (!res.ok) {
                alert(t('admin.session_invalid'));
                return window.location.href = "/";
            }

            const me = await res.json();

            if (me.role !== 'admin' && me.role !== 'superadmin' && me.role !== 'owner') {
                alert(t('admin.not_admin'));
                return window.location.href = "/";
            }

            const teamLabel = document.getElementById('admin-team-name');
            if (teamLabel) teamLabel.textContent = me.team_name || '?';

            if (me.role === 'superadmin' || me.role === 'owner') {
                const saLink = document.getElementById('link-superadmin');
                if (saLink) saLink.style.display = '';
            }
            if (me.role === 'owner') {
                const ownerLink = document.getElementById('link-owner');
                if (ownerLink) ownerLink.style.display = '';
            }

            document.getElementById('admin-body').classList.remove('opacity-0');
            loadAdminUsers();
            loadAdminCategories();
            loadCategoriesForRules();
            loadRules();
            loadDareLog();
            loadGlobalLog();
        }

        // Fonction fetch sécurisée — passe le token user en Bearer
        async function adminFetch(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${myUserId}`
            };
            const res = await fetch(url, options);

            if (res.status === 401 || res.status === 403) {
                alert(t('common.access_denied'));
                window.location.href = "/";
                return;
            }
            return res;
        }

        async function loadAdminUsers() {
            try {
                const [resUsers, resDares, resCats] = await Promise.all([
                    adminFetch('/api/admin/users'),
                    adminFetch('/api/admin/dares'),
                    adminFetch('/api/categories')
                ]);

                const users = await resUsers.json();
                const dares = await resDares.json();
                const categories = await resCats.json();

                const list = document.getElementById('admin-users-list');
                if (!list) return;
                
                list.innerHTML = users.map(u => {
                    const isActive = u.active === 1;
                    const activeDares = dares.filter(d => d.userId === u.id);

                    return `
                        <tr class="border-b border-slate-100 ${!isActive ? 'bg-slate-50 opacity-60' : 'hover:bg-slate-50/50'} transition-colors">
                            <td class="p-4">
                                <div class="font-bold ${isActive ? 'text-slate-800' : 'text-slate-400 italic'}">
                                    ${u.name} ${!isActive ? t('admin.user_deactivated') : ''}
                                </div>
                                ${activeDares.map(d => `<div class="text-[9px] text-orange-600 font-black uppercase">${t('admin.has_gage')}</div>`).join('')}
                            </td>

                            <td class="p-4 text-xs font-mono text-slate-400 hidden sm:table-cell">
                                ${isActive ? `.../login/${u.token}` : '---'}
                            </td>

                            <td class="p-4">
                                <div class="flex items-center justify-end gap-3">

                                    <div class="flex gap-1">
                                        ${categories.map(cat => {
                                            const hasGageForThisCat = activeDares.some(d => String(d.categoryId) === String(cat.id));
                                            if (!hasGageForThisCat) return '';

                                            return `
                                                <button onclick="clearCategoryPoints('${u.id}', '${cat.id}', '${cat.name}', '${u.name}')"
                                                        class="w-10 h-10 flex flex-col items-center justify-center bg-orange-50 hover:bg-orange-100 rounded-lg border border-orange-200 transition-all shadow-sm animate-bounce-short"
                                                        title="${cat.name}">
                                                    <span class="text-xs">${cat.emoji}</span>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>

                                    <div class="flex items-center gap-4 ml-4 border-l border-slate-200 pl-4">
                                        ${isActive ? `
                                            <button onclick="copyLink('${u.token}')" class="text-xs font-black text-blue-600 uppercase hover:underline">${t('common.copy_link')}</button>
                                            <button onclick="toggleUser('${u.id}', false)" class="text-xs font-black text-red-400 hover:text-red-600 uppercase">${t('common.deactivate')}</button>
                                        ` : `
                                            <button onclick="toggleUser('${u.id}', true)" class="text-xs font-black text-emerald-600 uppercase">${t('common.restore')}</button>
                                        `}
                                    </div>

                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error("Erreur de chargement admin:", err);
            }
        }

        async function toggleUser(id, shouldActivate) {
            const url = shouldActivate ? `/api/admin/users/${id}/restore` : `/api/admin/users/${id}`;
            const method = shouldActivate ? 'PATCH' : 'DELETE'; // On utilise DELETE pour désactiver car c'est notre route existante
            
            if (confirm(shouldActivate ? t('admin.confirm_restore_user') : t('admin.confirm_deactivate_user'))) {
                await adminFetch(url, { method });
                loadAdminUsers();
            }
        }

        function copyLink(token) {
            const url = `${window.location.origin}/login/${token}`;
            navigator.clipboard.writeText(url);
            alert(t('admin.toast_link_copied'));
        }

        async function addUser() {
            const name = document.getElementById('new-user-name').value;
            const email = document.getElementById('new-user-email').value;
            if(!name) return;

            await adminFetch('/api/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });

            document.getElementById('new-user-name').value = '';
            document.getElementById('new-user-email').value = '';
            loadAdminUsers();
        }

        // Fonction universelle pour supprimer avec confirmation
        async function deleteItem(type, id, name) {
            const confirmMessage = type === 'user' 
                ? `Es-tu sûr de vouloir retirer ${name} de l'équipe ?`
                : `Supprimer le badge ${name} ?`;

            if (confirm(confirmMessage)) {
                const res = await adminFetch(`/api/admin/${type}s/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    type === 'user' ? loadAdminUsers() : loadAdminCategories();
                }
            }
        }

        async function addCategory() {
            const nameInput = document.getElementById('new-cat-name');
            const emojiInput = document.getElementById('new-cat-emoji');

            if (!nameInput.value || !emojiInput.value) {
                return alert(t('admin.fill_required'));
            }

            // On utilise adminFetch : il gère déjà le mot de passe et le 401
            const response = await adminFetch('/api/admin/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: nameInput.value,
                    emoji: emojiInput.value
                })
            });

            if (response && response.ok) {
                nameInput.value = '';
                emojiInput.value = '';
                // On rafraîchit immédiatement la liste des catégories sur la page admin
                loadAdminCategories();
                // Optionnel : rafraîchir la liste pour les règles de gages
                loadCategoriesForRules(); 
            }
        }

        // Nouvelle fonction pour charger les catégories
        async function loadAdminCategories() {
            const res = await adminFetch('/api/admin/categories');
            if (!res.ok) return;
            
            const cats = await res.json();
            const list = document.getElementById('admin-categories-list');
            
            // On affiche sous forme de petites cartes ou lignes
            list.innerHTML = cats.map(c => {
                const isActive = c.active === 1;
                return `
                    <div class="relative group flex flex-col p-5 bg-white rounded-2xl border-2 ${isActive ? 'border-slate-100' : 'border-slate-50 bg-slate-50/50'} transition-all shadow-sm">
                        
                        <div class="flex items-center gap-4 mb-4">
                            <span class="text-4xl ${!isActive ? 'grayscale opacity-30' : ''}">${c.emoji}</span>
                            <div class="flex flex-col">
                                <span class="font-bold text-lg ${isActive ? 'text-slate-800' : 'text-slate-400 italic'}">${c.name}</span>
                                <span class="text-[10px] font-black uppercase tracking-widest ${isActive ? 'text-emerald-500' : 'text-slate-400'}">
                                    ${isActive ? t('admin.badge_active') : t('admin.badge_inactive')}
                                </span>
                            </div>
                        </div>

                        <div class="flex justify-end mt-auto">
                            <button onclick="toggleCategory('${c.id}', ${!isActive})"
                                    class="p-2 rounded-xl transition-all ${isActive ? 'bg-red-50 text-red-400 hover:bg-red-100' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'}"
                                    title="${isActive ? t('common.deactivate') : t('common.restore')}">
                                ${isActive 
                                    ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                                    </svg>` 
                                    : `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                    </svg>`
                                }
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function toggleCategory(id, shouldActivate) {
            const url = shouldActivate ? `/api/admin/categories/${id}/restore` : `/api/admin/categories/${id}`;
            const method = shouldActivate ? 'PATCH' : 'DELETE';
            
            if (confirm(shouldActivate ? t('admin.confirm_restore_badge') : t('admin.confirm_deactivate_badge'))) {
                await adminFetch(url, { method });
                loadAdminCategories();
            }
        }

        // On récupère d'abord les gages dispo
        let availableDares = [];
        async function loadDares() {
            const res = await adminFetch('/api/admin/dares');
            availableDares = await res.json();
            renderDaresList(); // Pour la gestion des gages eux-mêmes
        }

        // Charger les catégories dans le menu déroulant du gage
        async function loadCategoriesForRules() {
            const res = await adminFetch('/api/admin/categories');
            const cats = await res.json();
            const select = document.getElementById('rule-cat');
            select.innerHTML = cats.map(c => `<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');
        }

        async function addRule() {
            const category_id = document.getElementById('rule-cat').value;
            const threshold = document.getElementById('rule-threshold').value;
            const dare_text = document.getElementById('rule-text').value;

            await adminFetch('/api/admin/rules', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category_id, threshold, dare_text })
            });
            
            loadRules(); // Rafraîchit la liste
        }

        async function loadRules() {
            const res = await adminFetch('/api/admin/rules');
            const rules = await res.json();
            const list = document.getElementById('rules-list');
            
            list.innerHTML = rules.map(r => `
                <div id="rule-row-${r.id}" class="p-3 bg-white border border-slate-100 rounded-lg shadow-sm">
                    <div class="rule-display flex justify-between items-center">
                        <span class="text-sm">${t('admin.rule_if')} <b>${r.cat_emoji} ${r.cat_name}</b> ${t('admin.rule_reaches')} <b>${r.threshold}</b> ${t('admin.rule_then')} <span class="text-orange-600 font-bold">${r.dare_text}</span></span>
                        <div class="flex gap-3 shrink-0 ml-3">
                            <button onclick="editRule('${r.id}', ${r.threshold}, \`${r.dare_text}\`)" class="text-blue-400 hover:text-blue-600 text-xs font-bold">${t('common.edit')}</button>
                            <button onclick="deleteRule('${r.id}')" class="text-red-400 hover:text-red-600 text-xs font-bold">${t('common.delete')}</button>
                        </div>
                    </div>
                    <div class="rule-edit hidden mt-2 flex gap-2 items-center">
                        <input type="number" id="edit-threshold-${r.id}" class="w-20 p-2 rounded-lg border text-sm" value="${r.threshold}">
                        <input type="text" id="edit-text-${r.id}" class="flex-1 p-2 rounded-lg border text-sm" value="${r.dare_text}">
                        <button onclick="saveRule('${r.id}')" class="bg-orange-600 text-white px-3 py-2 rounded-lg text-xs font-bold">OK</button>
                        <button onclick="cancelEdit('${r.id}')" class="text-slate-400 text-xs font-bold">${t('common.cancel')}</button>
                    </div>
                </div>
            `).join('');
        }

        function editRule(id) {
            const row = document.getElementById(`rule-row-${id}`);
            row.querySelector('.rule-display').classList.add('hidden');
            row.querySelector('.rule-edit').classList.remove('hidden');
        }

        function cancelEdit(id) {
            const row = document.getElementById(`rule-row-${id}`);
            row.querySelector('.rule-display').classList.remove('hidden');
            row.querySelector('.rule-edit').classList.add('hidden');
        }

        async function saveRule(id) {
            const threshold = document.getElementById(`edit-threshold-${id}`).value;
            const dare_text = document.getElementById(`edit-text-${id}`).value;
            if (!dare_text || !threshold) return;
            await adminFetch(`/api/admin/rules/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ threshold, dare_text })
            });
            loadRules();
        }

        async function deleteRule(id) {
            if(confirm(t('admin.rule_confirm_delete'))) {
                await adminFetch(`/api/admin/rules/${id}`, { method: 'DELETE' });
                loadRules();
            }
        }

        async function clearCategoryPoints(userId, catId, catName, userName) {
            if (!confirm(t('admin.confirm_clear_category', { cat: catName, user: userName }))) return;

            // Utilisation de adminFetch pour inclure le header X-Admin-Password
            const res = await adminFetch(`/api/admin/clear-category/${userId}/${catId}`, { 
                method: 'POST' 
            });
            
            if (res && res.ok) {
                await loadAdminUsers();
            }
        }

        function formatSmartDate(dateIso) {
            const date = new Date(dateIso);
            const now = new Date();
            const diffInDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

            const time = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

            if (diffInDays === 0 && date.getDate() === now.getDate()) {
                return `Aujourd'hui à ${time}`;
            } else if (diffInDays === 1 || (diffInDays === 0 && date.getDate() !== now.getDate())) {
                return `Hier à ${time}`;
            } else {
                const dayMonth = date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
                return `${dayMonth} à ${time}`;
            }
        }

        async function loadDareLog() {
            const res = await adminFetch('/api/admin/dare-log');
            const logs = await res.json();
            const container = document.getElementById('admin-dare-log');
            if (!container) return;

            if (logs.length === 0) {
                container.innerHTML = `<p class="text-xs italic text-slate-400 text-center py-4">${t('admin.dare_log_empty')}</p>`;
                return;
            }

            container.innerHTML = logs.map(log => `
                <div class="flex items-center justify-between p-3 bg-orange-50 rounded-xl border border-orange-100">
                    <div class="flex items-center gap-3 text-sm">
                        <span class="text-lg">${log.emoji}</span>
                        <span class="text-slate-600">
                            <b class="text-slate-800">${log.user_name}</b>
                            ${t('admin.dare_log_did')} <span class="text-orange-600 font-bold">${log.dare_text}</span>
                        </span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 shrink-0 ml-4">${formatSmartDate(log.cleared_at)}</span>
                </div>
            `).join('');
        }

        async function loadGlobalLog() {
            const res = await adminFetch('/api/admin/points-log');
            const logs = await res.json();
            const container = document.getElementById('admin-global-log');
            if (!container) return;

            container.innerHTML = logs.map(log => `
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 hover:bg-white transition-all group">
                    <div class="flex items-center gap-3 text-sm">
                        <span class="text-lg">${log.emoji}</span>
                        <span class="text-slate-600">
                            <b class="text-slate-800">${log.from_name}</b>
                            ${t('admin.global_log_gave')}
                            <b class="text-slate-800">${log.to_name}</b>
                        </span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-[10px] font-bold text-slate-400">
                            ${formatSmartDate(log.created_at)}
                        </span>
                        <button onclick="deletePoint('${log.id}')" 
                                class="text-red-300 hover:text-red-600 transition-colors p-1 opacity-0 group-hover:opacity-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function deletePoint(pointId) {
            if (!confirm(t('admin.confirm_delete_point'))) return;

            const res = await adminFetch(`/api/admin/points/${pointId}`, {
                method: 'DELETE'
            });

            if (res && res.ok) {
                if (window.showToast) window.showToast(t('admin.toast_point_deleted'));
                // On rafraîchit tout pour que les compteurs soient justes
                loadGlobalLog();
                loadAdminUsers();
            }
        }

        async function deleteSpecificPoint(pointId, userName) {
        if (!confirm(t('admin.confirm_delete_point'))) return;

            const res = await adminFetch(`/api/admin/points/${pointId}`, {
                method: 'DELETE'
            });

            if (res && res.ok) {
                // On utilise la fonction de app.js pour notifier
                if (window.showToast) {
                    window.showToast("Le point a été effacé", "success");
                } else {
                    alert("Point effacé");
                }
                
                // On rafraîchit les données pour voir le score baisser
                if (window.loadAdminUsers) window.loadAdminUsers();
                // Si tu as une modale d'historique ouverte, il faudra aussi la rafraîchir ou la fermer
            }
        }

        checkAndLoad();

        window.loadAdminCategories = loadAdminCategories;
        window.loadAdminUsers = loadAdminUsers;
    </script>
