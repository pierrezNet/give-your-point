<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <!-- Fond gradient -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Bulles décoratives -->
  <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="1100" cy="550" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="950" cy="120" r="40" fill="#ffffff" opacity="0.08"/>

  <!-- Logo + titre -->
  <g transform="translate(80, 130)">
    <text font-family="system-ui, sans-serif" font-size="80" fill="#ffffff">🎯</text>
    <text x="100" y="65" font-family="system-ui, sans-serif" font-size="72" font-weight="900" fill="#ffffff">Donne Ton Point</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="290" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#dbeafe">
    Le rituel d'équipe pour s'offrir points et gages.
  </text>

  <!-- 3 cartes utilisateur en bas -->
  <g transform="translate(80, 360)">
    <!-- Carte 1 - Alice -->
    <g>
      <rect width="320" height="200" rx="20" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="270" y="20" width="35" height="22" rx="6" fill="#facc15"/>
      <text x="287" y="36" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="900" fill="#1e293b">#1</text>
      <circle cx="160" cy="80" r="38" fill="#dbeafe"/>
      <text x="160" y="93" text-anchor="middle" font-family="system-ui" font-size="34" font-weight="900" fill="#2563eb">A</text>
      <text x="160" y="140" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#1e293b">Alice</text>
      <text x="160" y="165" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="900" fill="#2563eb">28 pts</text>
      <text x="80" y="190" font-size="22">😂</text>
      <text x="115" y="190" font-size="22">👿</text>
      <text x="150" y="190" font-size="22">🤷</text>
      <text x="185" y="190" font-size="22">😴</text>
      <text x="220" y="190" font-size="22">😡</text>
    </g>
    <!-- Carte 2 - Bob -->
    <g transform="translate(360, 0)">
      <rect width="320" height="200" rx="20" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="270" y="20" width="35" height="22" rx="6" fill="#cbd5e1"/>
      <text x="287" y="36" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="900" fill="#1e293b">#2</text>
      <circle cx="160" cy="80" r="38" fill="#fef3c7"/>
      <text x="160" y="93" text-anchor="middle" font-family="system-ui" font-size="34" font-weight="900" fill="#ca8a04">B</text>
      <text x="160" y="140" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#1e293b">Bob</text>
      <text x="160" y="165" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="900" fill="#2563eb">19 pts</text>
      <text x="100" y="190" font-size="22">😂</text>
      <text x="140" y="190" font-size="22">👿</text>
      <text x="180" y="190" font-size="22">🤷</text>
    </g>
    <!-- Carte 3 - Carla avec gage -->
    <g transform="translate(720, 0)">
      <rect width="320" height="200" rx="20" fill="url(#card)" stroke="#ea580c" stroke-width="3"/>
      <rect x="270" y="20" width="35" height="22" rx="6" fill="#fdba74"/>
      <text x="287" y="36" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="900" fill="#1e293b">#3</text>
      <circle cx="160" cy="80" r="38" fill="#fed7aa"/>
      <text x="160" y="93" text-anchor="middle" font-family="system-ui" font-size="34" font-weight="900" fill="#c2410c">C</text>
      <text x="160" y="140" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#1e293b">Carla</text>
      <text x="160" y="165" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="900" fill="#2563eb">12 pts</text>
      <rect x="40" y="178" width="240" height="22" rx="11" fill="#ea580c"/>
      <text x="160" y="194" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="900" fill="#ffffff">🚨 GAGE : VIENNOISERIES</text>
    </g>
  </g>
</svg>
