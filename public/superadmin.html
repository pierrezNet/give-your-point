<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superadmin — Donne Ton Point</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/styles.css?v=20261028">
    <noscript><link rel="stylesheet" href="/noscript.css"></noscript>
    <script type="module" src="/js/pages/superadmin.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 opacity-0 transition-opacity duration-500" id="superadmin-body">
    <noscript>
        <div role="note" class="max-w-md mx-auto my-8 bg-white rounded-2xl p-6 border border-slate-200 text-center">
            <p class="font-bold text-slate-800" lang="fr">Cette page a besoin de JavaScript. Active-le dans ton navigateur, puis recharge la page.</p>
            <p class="text-slate-600 mt-2" lang="en">This page needs JavaScript. Enable it in your browser, then reload the page.</p>
            <a href="/" class="inline-block mt-3 text-sm font-bold text-blue-700 underline"><span lang="fr">Retour à l'accueil</span> · <span lang="en">Back to home</span></a>
        </div>
    </noscript>
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-xl md:text-3xl font-black text-slate-800" data-i18n="superadmin.title">Console Superadmin 🏛️</h1>
                <p class="text-xs md:text-sm font-bold text-slate-600 mt-1"><span data-i18n="superadmin.company_label">Société :</span> <span id="superadmin-company-name">…</span></p>
            </div>
            <div class="flex flex-wrap justify-end gap-x-3 gap-y-2 items-center text-sm">
                <a href="/owner" data-requires-role="owner" class="hidden text-emerald-700 font-bold hover:underline whitespace-nowrap" data-i18n="nav.owner">Owner 🌐</a>
                <a href="/admin" class="text-purple-700 font-bold hover:underline whitespace-nowrap" data-i18n="common.back_to_admin">← Admin</a>
                <a href="/" class="text-blue-600 font-bold hover:underline whitespace-nowrap" data-i18n="common.back_to_app">← App</a>
                <span class="text-slate-600 hidden sm:inline">|</span>
                <span class="whitespace-nowrap">
                    <button type="button" data-lang-toggle="fr" lang="fr" class="text-xs font-bold text-slate-600 px-1">FR</button>
                    <span class="text-slate-600">/</span>
                    <button type="button" data-lang-toggle="en" lang="en" class="text-xs font-bold text-slate-600 px-1">EN</button>
                </span>
            </div>
        </header>

        <div class="bg-white p-2 md:p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800" data-i18n="superadmin.teams_title">Équipes</h2>
                <button type="button" data-action="create-team" class="bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold hover:bg-emerald-700 transition-colors text-sm" data-i18n="superadmin.btn_create_team">
                    + Créer une équipe
                </button>
            </div>
            <table class="w-full text-left">
                <thead class="bg-slate-100 border-b border-slate-200">
                    <tr>
                        <th class="p-4 font-bold text-slate-600" data-i18n="superadmin.col_team_name">Nom</th>
                        <th class="p-4 font-bold text-slate-600 hidden md:table-cell" data-i18n="superadmin.col_admins">Admin(s)</th>
                        <th class="p-4 font-bold text-slate-600 hidden sm:table-cell" data-i18n="superadmin.col_members">Membres</th>
                        <th class="p-4 font-bold text-slate-600 text-right" data-i18n="superadmin.col_actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="teams-list"></tbody>
            </table>
        </div>

        <div class="bg-white p-2 md:p-6 rounded-2xl shadow-sm border border-slate-200 mt-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800" data-i18n="superadmin.admins_title">Administrateurs</h2>
                <button type="button" data-action="promote-member" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-blue-700 transition-colors text-sm" data-i18n="superadmin.btn_promote">
                    + Promouvoir un membre
                </button>
            </div>
            <div id="admins-list" class="space-y-3"></div>
        </div>
    </div>

</body>
</html>
